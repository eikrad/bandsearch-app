name: Build desktop installers

# Builds the installers and the updater manifest (latest.json) for a release.
# Normally called by release-please.yml once a release PR is merged, with the draft
# release it created; that workflow publishes the release after all builds pass,
# so the in-app updater never sees a release without latest.json.
# Run it by hand (Actions → Build desktop installers → Run workflow) to build a
# test tag into a new draft release, as pushing a v* tag used to.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, e.g. v0.5.0
        required: true
        type: string
      release_id:
        description: Draft release to upload into
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build into a new draft release, e.g. v0.4.1-test
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      # The installers ship the same Node release the hosted API runs (.nvmrc),
      # so a Node security release is one edit there.
      - name: Node sidecar version
        run: echo "NODE_SIDECAR=v$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_ENV"

      - name: Node sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://nodejs.org/dist/${NODE_SIDECAR}/node-${NODE_SIDECAR}-linux-x64.tar.gz" | tar xz
          mkdir -p apps/desktop/src-tauri/binaries
          rm -f apps/desktop/src-tauri/binaries/node-x86_64-unknown-linux-gnu
          cp "node-${NODE_SIDECAR}-linux-x64/bin/node" \
            apps/desktop/src-tauri/binaries/node-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/node-x86_64-unknown-linux-gnu

      - name: Node sidecar (macOS ARM)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL "https://nodejs.org/dist/${NODE_SIDECAR}/node-${NODE_SIDECAR}-darwin-arm64.tar.gz" | tar xz
          mkdir -p apps/desktop/src-tauri/binaries
          rm -f apps/desktop/src-tauri/binaries/node-aarch64-apple-darwin
          cp "node-${NODE_SIDECAR}-darwin-arm64/bin/node" \
            apps/desktop/src-tauri/binaries/node-aarch64-apple-darwin
          chmod +x apps/desktop/src-tauri/binaries/node-aarch64-apple-darwin

      - name: Node sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://nodejs.org/dist/$env:NODE_SIDECAR/node-$env:NODE_SIDECAR-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath .
          New-Item -ItemType Directory -Force -Path apps\desktop\src-tauri\binaries | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue apps\desktop\src-tauri\binaries\node-x86_64-pc-windows-msvc.exe
          Copy-Item "node-$env:NODE_SIDECAR-win-x64\node.exe" `
            apps\desktop\src-tauri\binaries\node-x86_64-pc-windows-msvc.exe

      - name: Install dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # With a release_id (from release-please) the assets go into that draft;
          # without one (manual run) tauri-action creates a draft for the tag.
          releaseId: ${{ inputs.release_id || '' }}
          tagName: ${{ inputs.tag }}
          releaseName: Bandsearch ${{ inputs.tag }}
          releaseDraft: true
          prerelease: ${{ !inputs.release_id }}
