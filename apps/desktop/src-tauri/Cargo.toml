[package]
name = "bandsearch"
version = "0.4.5"
edition = "2021"
rust-version = "1.77"

# Spike #319: the mobile shell needs a shared library (amendment 7: no staticlib until iOS).
[lib]
name = "bandsearch_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

# Desktop-only (exact inverse of Tauri's `mobile` cfg alias; shell research amendment 3).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
# The mock runtime (tauri::test), for checking the ACL end to end.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
