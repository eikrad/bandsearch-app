services:
  - type: web
    name: bandsearch-api
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PREFERENCE_STORE
        value: turso
      # Closed beta: every request needs a token, registration needs an invite
      # (ADR 0005). Needs JWT_SECRET below, or the server refuses to start.
      - key: AUTH_MODE
        value: enforced
      - key: EVAL_DASHBOARD_ENABLED
        value: false
      # Secrets — set via the Render dashboard, not stored here:
      # SCW_SECRET_KEY: Scaleway, the default LLM provider (ADR 0004).
      - key: SCW_SECRET_KEY
        sync: false
      # Rollback only: set LLM_PROVIDER=gemini in the dashboard to run on Gemini
      # again. Removed together with Gemini (#237).
      - key: GEMINI_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
